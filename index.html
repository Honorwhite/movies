<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack | Film & Dizi Takip</title>

    <!-- PWA & SEO -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <link rel="icon" type="image/png" href="appimages/android/android-launchericon-192-192.png">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Background Effects -->
    <div class="bg-glow"></div>

    <!-- App Loader -->
    <div id="appLoader" class="app-loader">
        <div class="loader-logo">CineTrack</div>
        <div class="loader-spinner"></div>
    </div>

    <!-- Auth Overlay -->
    <div id="authOverlay" class="auth-overlay" style="display: none;">
        <div class="auth-card" id="authContainer">
            <!-- Populated by script.js -->
        </div>
    </div>

    <!-- Navigation -->
    <nav class="glass-nav">
        <div class="logo" onclick="app.switchView('search')">
            <i class="fas fa-play-circle" style="color: var(--primary);"></i>
            <span>CineTrack</span>
        </div>
        <div class="nav-links">
            <button class="nav-btn active" onclick="app.switchView('search')" data-view="search">
                <i class="fas fa-compass"></i> Keşfet
            </button>
            <button class="nav-btn" onclick="app.switchView('watched')" data-view="watched">
                <i class="fas fa-check-circle"></i> İzlediklerim
            </button>
            <button class="nav-btn" onclick="app.switchView('watchlist')" data-view="watchlist">
                <i class="fas fa-bookmark"></i> İzlenecekler
            </button>
            <button class="nav-btn" onclick="app.switchView('profile')" data-view="profile">
                <i class="fas fa-user-circle"></i> Profil
            </button>
        </div>
    </nav>

    <main class="content-container">
        <!-- Search & Discover View -->
        <section id="searchView" class="view active">
            <div class="search-container">
                <div class="search-wrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="movieSearch" class="search-input" placeholder="Film veya dizi arayın...">
                </div>
            </div>

            <div class="section-header">
                <h3 class="section-title" id="gridTitle">Önerilenler</h3>
                <div id="genreChips" class="genre-chips">
                    <!-- Genre chips if needed -->
                </div>
            </div>

            <div id="searchResults" class="movie-grid">
                <!-- Movie cards injected here -->
            </div>

            <div id="loadMoreTrigger" style="height: 20px;"></div>
        </section>

        <!-- Watched View -->
        <section id="watchedView" class="view">
            <div class="section-header">
                <h2 class="section-title">İzlediğim Filmler</h2>
                <div class="header-actions">
                    <div class="sort-controls">
                        <button class="sort-btn" onclick="app.sortList('watched', 'title', 'watchedList')"
                            title="A-Z Sırala">
                            <i class="fas fa-sort-alpha-down"></i> Ad
                        </button>
                        <button class="sort-btn" onclick="app.sortList('watched', 'vote_average', 'watchedList')"
                            title="Puana Göre">
                            <i class="fas fa-star"></i> Puan
                        </button>
                        <button class="sort-btn" onclick="app.sortList('watched', 'release_date', 'watchedList')"
                            title="Tarihe Göre">
                            <i class="fas fa-calendar-alt"></i> Tarih
                        </button>
                    </div>
                    <div class="search-wrapper list-search">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="watchedSearch" class="search-input" placeholder="Listende ara...">
                    </div>
                </div>
            </div>
            <div id="watchedStats" class="stats-grid"></div>
            <div id="watchedList" class="movie-grid"></div>
        </section>

        <!-- Watchlist View -->
        <section id="watchlistView" class="view">
            <div class="section-header">
                <h2 class="section-title">İzlenecekler Listesi</h2>
                <div class="header-actions">
                    <div class="sort-controls">
                        <button class="sort-btn" onclick="app.sortList('watchlist', 'title', 'watchlist')"
                            title="A-Z Sırala">
                            <i class="fas fa-sort-alpha-down"></i> Ad
                        </button>
                        <button class="sort-btn" onclick="app.sortList('watchlist', 'vote_average', 'watchlist')"
                            title="Puana Göre">
                            <i class="fas fa-star"></i> Puan
                        </button>
                        <button class="sort-btn" onclick="app.sortList('watchlist', 'release_date', 'watchlist')"
                            title="Tarihe Göre">
                            <i class="fas fa-calendar-alt"></i> Tarih
                        </button>
                    </div>
                    <div class="search-wrapper list-search">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="watchlistSearch" class="search-input" placeholder="Listende ara...">
                    </div>
                </div>
            </div>
            <div id="watchlistStats" class="stats-grid"></div>
            <div id="watchlist" class="movie-grid"></div>
        </section>

        <!-- Profile View -->
        <section id="profileView" class="view">
            <div class="section-header">
                <h2 class="section-title">Profil Ayarları</h2>
            </div>
            <div class="auth-card" style="max-width: 600px; margin: 0 auto; text-align: left;">
                <h3 id="profileName" style="margin-bottom: 2rem; font-size: 2rem;">Kullanıcı Adı</h3>
                <div class="settings-group">
                    <button class="btn-primary" onclick="app.logout()" style="background: #ef4444;">
                        <i class="fas fa-sign-out-alt"></i> Oturumu Kapat
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- Player Modal -->
    <div id="playerModal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="app.closePlayer()"><i class="fas fa-times"></i></button>
            <div class="player-controls">
                <select id="sourceSelect" class="player-select" onchange="app.updatePlayerSrc()">
                    <option value="vidsrc" selected>Source 1 (VidSrc.xyz)</option>
                    <option value="vidfast">Source 2 (VidFast)</option>
                    <option value="videasy">Source 3 (VidEasy)</option>
                </select>
                <div id="tvSelectors" style="display: none; gap: 0.5rem;">
                    <select id="seasonSelect" class="player-select" onchange="app.handleSeasonChange()">
                        <!-- Populated by JS -->
                    </select>
                    <select id="episodeSelect" class="player-select" onchange="app.updatePlayerSrc()">
                        <!-- Populated by JS -->
                    </select>
                </div>
            </div>
            <iframe id="moviePlayer" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
