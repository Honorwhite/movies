<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack - Film & Dizi Takip</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <nav class="glass-nav">
        <div class="logo">
            <i class="fas fa-clapperboard"></i>
            <span>CineTrack</span>
            <div id="syncStatus" class="sync-status">
                <i class="fas fa-cloud"></i>
                <span>Senkronize ediliyor...</span>
            </div>
        </div>
        <div class="nav-links">
            <button class="nav-btn active" data-view="search">Arama</button>
            <button class="nav-btn" data-view="watched">İzlediklerim</button>
            <button class="nav-btn" data-view="watchlist">İzlenecekler</button>
        </div>
    </nav>

    <main class="content-container">
        <!-- Search View -->
        <section id="searchView" class="view active">
            <div class="search-header">
                <h1>Yeni Bir Şeyler Keşfedin</h1>
                <div class="search-bar-container">
                    <input type="text" id="movieSearch" placeholder="Film veya dizi arayın...">
                    <button id="searchBtn"><i class="fas fa-search"></i></button>
                </div>
            </div>

            <div id="searchResults" class="movie-grid">
                <!-- Search results will be injected here -->
            </div>

            <div id="featuredCarousel" class="featured-carousel-container">
                <h3 class="carousel-title">Takip Listenizden Öne Çıkanlar</h3>
                <div class="carousel-track-wrapper">
                    <div id="carouselTrack" class="carousel-track">
                        <!-- Watchlist items will be cloned and injected here -->
                    </div>
                </div>
            </div>
        </section>

        <!-- Watched View -->
        <section id="watchedView" class="view">
            <div class="view-header">
                <h2>İzlediklerim</h2>
                <div class="filters">
                    <div class="list-search-wrapper">
                        <i class="fas fa-search"></i>
                        <input type="text" id="watchedSearch" placeholder="Listede ara..." class="list-search-input">
                    </div>
                </div>
            </div>
            <div id="watchedList" class="movie-grid">
                <!-- Watched movies will be injected here -->
            </div>
        </section>

        <!-- Watchlist View -->
        <section id="watchlistView" class="view">
            <div class="view-header">
                <h2>İzlenecekler</h2>
                <div class="filters">
                    <div class="list-search-wrapper">
                        <i class="fas fa-search"></i>
                        <input type="text" id="watchlistSearch" placeholder="Listede ara..." class="list-search-input">
                    </div>
                </div>
            </div>
            <div id="watchlist" class="movie-grid">
                <!-- Watchlist movies will be injected here -->
            </div>
        </section>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content glass">
            <h2><i class="fas fa-cloud"></i> Bulut Ayarları</h2>
            <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1.5rem;">Vercel'de cihazlar arası
                senkronizasyon için Supabase bilgilerini girin.</p>

            <div class="input-group">
                <label>Supabase URL</label>
                <input type="text" id="supabaseUrl" placeholder="https://xyz.supabase.co">
            </div>
            <div class="input-group">
                <label>Supabase Anon Key</label>
                <input type="password" id="supabaseKey" placeholder="eyJhbGciOiJIUzI1NiI...">
            </div>

            <div class="modal-actions">
                <button id="saveCloudSettings" class="primary-btn">Kaydet</button>
                <button id="closeSettingsModal" class="secondary-btn">Kapat</button>
            </div>

            <div style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted);">
                <p>Not: Yerel sunucu (server.js) açıksa dosyaya kayıt önceliklidir.</p>
            </div>
        </div>
    </div>



    <script src="script.js"></script>
</body>

</html>
