<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack - Film & Dizi Takip</title>
    <link rel="icon" type="image/png" href="appimages/android/android-launchericon-192-192.png">
    <link rel="apple-touch-icon" href="appimages/android/android-launchericon-192-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://image.tmdb.org">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div id="userSelectionOverlay" class="user-selection-overlay">
        <div class="user-selection-content glass" id="authContainer">
            <!-- Content will be populated by script.js (showLogin/showRegister) -->
            <div class="loading-spinner">
                <i class="fas fa-circle-notch fa-spin"></i>
                <p>Yükleniyor...</p>
            </div>
        </div>
    </div>

    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <nav class="glass-nav">
        <div class="logo">
            <span>CineTrack</span>
            <div id="syncStatus" class="sync-status">
                <i class="fas fa-cloud"></i>
                <span>Senkronize ediliyor...</span>
            </div>
        </div>
        <div class="nav-links">
            <button class="nav-btn active" data-view="search">
                <i class="fas fa-search"></i>
                <span>Arama</span>
            </button>
            <button class="nav-btn" data-view="watched">
                <i class="fas fa-check-circle"></i>
                <span>İzlediklerim</span>
            </button>
            <button class="nav-btn" data-view="watchlist">
                <i class="fas fa-bookmark"></i>
                <span>İzlenecekler</span>
            </button>
            <button class="nav-btn user-profile-btn" data-view="profile" title="Profil">
                <i class="fas fa-user-circle"></i>
                <span id="activeUserName">Yükleniyor...</span>
            </button>
        </div>
    </nav>

    <main class="content-container">
        <!-- Search View -->
        <section id="searchView" class="view active">
            <div class="search-header" id="heroSection">
                <div class="hero-backdrop" id="heroBackdrop"></div>
                <div class="hero-content">
                    <h1>Yeni Bir Şeyler Keşfedin</h1>
                    <div class="search-bar-container">
                        <!-- Dummy hidden fields to catch aggressive browser autofill -->
                        <input type="text" style="display:none;" name="fake_username_remembered" />
                        <input type="password" style="display:none;" name="fake_password_remembered" />

                        <input type="text" id="movieSearch" name="never_save_this_field"
                            placeholder="Film veya dizi arayın..." autocomplete="new-password" data-lpignore="true"
                            spellcheck="false">
                        <button id="searchBtn"><i class="fas fa-search"></i></button>
                    </div>
                    <div id="heroMovieInfo" class="hero-movie-info">
                        <!-- Will be populated by JS -->
                    </div>
                </div>
                <div class="scroll-indicator"
                    onclick="document.getElementById('searchResults').scrollIntoView({behavior: 'smooth'})">
                    <div class="mouse">
                        <div class="wheel"></div>
                    </div>
                    <div class="arrows">
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </div>

            <div id="searchResults" class="movie-grid">
                <!-- Search results will be injected here -->
            </div>



            <!-- Recommended Movies Section -->
            <div id="recommendedSection" class="recommended-section">
                <h3 class="section-title">Önerilen Film & Diziler</h3>

                <div class="categories-container">
                    <div id="genreChips" class="genre-chips">
                        <!-- Genre chips will be injected here -->
                    </div>
                </div>

                <div id="recommendedMovies" class="movie-grid">
                    <!-- Recommended movies will be injected here -->
                </div>
                <div id="loadingIndicator" class="loading-indicator">
                    <div class="spinner"></div>
                    <p>Yeni filmler yükleniyor...</p>
                </div>
            </div>
        </section>

        <!-- Watched View -->
        <section id="watchedView" class="view">
            <div class="view-header">
                <h2>İzlediklerim</h2>
                <div class="filters">
                    <div class="sort-controls" data-list="watched">
                        <button class="sort-btn active" data-sort="abc" title="Alfabetik"><i
                                class="fas fa-sort-alpha-down"></i></button>
                        <button class="sort-btn" data-sort="year" title="Yıla Göre"><i
                                class="fas fa-calendar-alt"></i></button>
                        <button class="sort-btn" data-sort="rating" title="Puana Göre"><i
                                class="fas fa-star"></i></button>
                    </div>
                    <div class="list-search-wrapper">
                        <i class="fas fa-search"></i>
                        <input type="search" id="watchedSearch" name="watchedSearch" placeholder="Listede ara..."
                            class="list-search-input" autocomplete="off">
                    </div>
                </div>
            </div>
            <div id="watchedStats" class="stats-grid">
                <!-- Stats will be injected here -->
            </div>
            <div class="categories-container">
                <div id="watchedGenreChips" class="genre-chips">
                    <!-- Genre chips will be injected here -->
                </div>
            </div>
            <div id="watchedList" class="movie-grid">
                <!-- Watched movies will be injected here -->
            </div>
        </section>

        <!-- Watchlist View -->
        <section id="watchlistView" class="view">
            <div class="view-header">
                <h2>İzlenecekler</h2>
                <div class="filters">
                    <div class="sort-controls" data-list="watchlist">
                        <button class="sort-btn active" data-sort="abc" title="Alfabetik"><i
                                class="fas fa-sort-alpha-down"></i></button>
                        <button class="sort-btn" data-sort="year" title="Yıla Göre"><i
                                class="fas fa-calendar-alt"></i></button>
                        <button class="sort-btn" data-sort="rating" title="Puana Göre"><i
                                class="fas fa-star"></i></button>
                    </div>
                    <div class="list-search-wrapper">
                        <i class="fas fa-search"></i>
                        <input type="search" id="watchlistSearch" name="watchlistSearch" placeholder="Listede ara..."
                            class="list-search-input" autocomplete="off">
                    </div>
                </div>
            </div>
            <div id="watchlistStats" class="stats-grid">
                <!-- Stats will be injected here -->
            </div>
            <div class="categories-container">
                <div id="watchlistGenreChips" class="genre-chips">
                    <!-- Genre chips will be injected here -->
                </div>
            </div>
            <div id="watchlist" class="movie-grid">
                <!-- Watchlist movies will be injected here -->
            </div>
        </section>

        <!-- Profile View -->
        <section id="profileView" class="view">
            <div class="view-header">
                <h2>Profil Ayarları</h2>
            </div>

            <div class="profile-container">
                <div class="profile-card glass">
                    <div class="profile-header-main">
                        <div class="profile-avatar"><i class="fas fa-user-circle"></i></div>
                        <h3 id="profileDisplayName">Kullanıcı Adı</h3>
                        <p class="profile-status">Aktif Oturum</p>
                    </div>

                    <div class="profile-section">
                        <h4>Şifre Değiştir</h4>
                        <div class="auth-form">
                            <div class="input-group">
                                <input type="password" id="newPassword" placeholder="Yeni Şifre">
                            </div>
                            <div id="profileMsg" style="font-size: 0.8rem; margin-top: -0.5rem; display: none;"></div>
                            <button class="primary-btn" onclick="changePassword()">Şifreyi Güncelle</button>
                        </div>
                    </div>

                    <div class="profile-section logout-section">
                        <button class="secondary-btn logout-full-btn" onclick="logout()">
                            <i class="fas fa-sign-out-alt"></i> Oturumu Kapat
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <div id="playerModal" class="player-modal">
        <div class="player-content">
            <button class="close-player" onclick="closePlayer()"><i class="fas fa-times"></i></button>
            <div class="player-wrapper">
                <iframe id="moviePlayer" src="" frameborder="0" allowfullscreen></iframe>
            </div>
            <div class="player-info" id="playerInfo">
                <!-- Movie info will be here -->
            </div>
        </div>
    </div>



    <button id="scrollTopBtn" class="scroll-top-btn" title="Yukarı Çık">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script src="script.js"></script>
</body>

</html>
